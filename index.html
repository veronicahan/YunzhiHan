<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Yunzhi Han’s personal website for research and teaching.">
  <title>Yunzhi Han</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #f6f4ed;
      --ink: #20372f;
      --muted: #4b6056;
      --line: #cdd5ca;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font: 1rem/1.7 system-ui, sans-serif;
    }

    .wrap { width: min(100% - 3rem, 55rem); margin-inline: auto; }

    header, footer {
      padding-block: 1.25rem;
      font-size: .875rem;
    }

    header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: .5rem 2rem;
      border-bottom: 1px solid var(--line);
    }

    nav { display: flex; gap: 1.25rem; }

    a { color: inherit; text-underline-offset: .25em; }
    a:hover { color: #367454; }
    a:focus-visible { outline: 2px solid currentColor; outline-offset: 4px; }

    .hero {
      display: grid;
      grid-template-columns: 1.15fr 1fr;
      gap: clamp(1.5rem, 5vw, 4rem);
      align-items: center;
      padding-block: clamp(3rem, 10vw, 7rem);
    }

    h1, h2 {
      margin: 0;
      font-family: Georgia, serif;
      line-height: 1.2;
    }

    h1 { font-size: clamp(2.8rem, 7vw, 5.5rem); }
    h2 { font-size: 1.6rem; }
    p { margin: 0; color: var(--muted); }
    .hero p { max-width: 22em; margin-top: 1.3rem; }

    .art {
      aspect-ratio: 5 / 4;
      border: 1px solid #a9bcaa;
      border-radius: .5rem;
      background:
        repeating-radial-gradient(ellipse at 30% 125%, transparent 0 17px, #3a665659 18px 19px, transparent 20px 26px),
        radial-gradient(circle at 72% 27%, #f7d5a4 0 10%, transparent 10.5%),
        linear-gradient(140deg, #e7edda 5%, #b9d1b6 55%, #638c76 100%);
    }

    section { scroll-margin-top: 1rem; }

    .entry {
      display: grid;
      grid-template-columns: minmax(8rem, 1fr) 2.5fr;
      gap: .65rem 2rem;
      border-top: 1px solid var(--line);
      padding-block: 1.65rem;
    }

    footer { border-top: 1px solid var(--line); color: var(--muted); }

    @media (max-width: 38rem) {
      .wrap { width: min(100% - 2rem, 55rem); }
      .hero, .entry { grid-template-columns: 1fr; }
      .art { aspect-ratio: 2 / 1; }
    }
  </style>
</head>
<body>
  <header class="wrap">
    <strong>Yunzhi Han</strong>
    <nav aria-label="Main navigation">
      <a href="#home">Home</a>
      <a href="#research">Research</a>
      <a href="#teaching">Teaching</a>
    </nav>
  </header>
  <main class="wrap">
    <section class="hero" id="home" aria-labelledby="home-title">
      <div>
        <h1 id="home-title">Yunzhi Han</h1>
        <p>Welcome to my website. Here you’ll find information about my research and teaching.</p>
      </div>
      <div class="art" aria-hidden="true"></div>
    </section>
    <section class="entry" id="research">
      <h2>Research</h2>
      <p>Research interests, projects, and publications will be listed here.</p>
    </section>
    <section class="entry" id="teaching">
      <h2>Teaching</h2>
      <p>Courses and teaching materials will be listed here.</p>
    </section>
  </main>
  <footer class="wrap">Yunzhi Han</footer>
</body>
</html>
